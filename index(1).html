<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2B Client Onboarding</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 35%),
        linear-gradient(135deg, #07111f, #10243e);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      padding: 34px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      background: rgba(37, 99, 235, 0.18);
      color: #93c5fd;
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #334155;
      border-radius: 11px;
      background: #0b1628;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.12);
    }

    input::placeholder {
      color: #64748b;
    }
button {
      width: 100%;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .status {
      display: none;
      margin-top: 20px;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #bbf7d0;
    }

    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 540px) {
      .container {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <span class="badge">Client Intake Form</span>

    <h1>B2B Client Onboarding</h1>
    <p class="subtitle">
      Enter the client’s information below. The form will send the data directly to the connected onboarding workflow.
    </p>

    <form id="onboardingForm">

      <div class="form-group">
        <label for="name">Client Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Sarah Whitfield"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Client Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="sarah@northbridge.io"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="company">Company Name</label>
        <input
          type="text"
          id="company"
          name="company"
          placeholder="Northbridge Logistics"
          autocomplete="organization"
          required
        />
      </div>

      <button type="submit" id="submitButton">
        Submit Client Information
      </button>
    </form>

    <div id="statusMessage" class="status" aria-live="polite"></div>

    <p class="footer-note">
      Client data is securely submitted to the connected onboarding workflow.
    </p>
  </main>

  <script>
    const form = document.getElementById("onboardingForm");
    const submitButton = document.getElementById("submitButton");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      // Replace this value with your n8n Test or Production Webhook URL.
      const webhookUrl = "http://localhost:5678/webhook/client-onboarding";
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const company = document.getElementById("company").value.trim();

      statusMessage.className = "status";
      statusMessage.textContent = "";

      if (!name || !email || !company) {
        showStatus("Please complete all fields.", "error");
        return;
      }

      const payload = {
        name,
        email,
        company
      };

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const contentType = response.headers.get("content-type") || "";
        let result;

        if (contentType.includes("application/json")) {
          result = await response.json();
        } else {
          result = await response.text();
        }

        if (!response.ok) {
          const errorMessage =
            typeof result === "object"
              ? JSON.stringify(result, null, 2)
              : result || `Request failed with status ${response.status}`;

          throw new Error(errorMessage);
        }

        const successMessage =
          typeof result === "object"
            ? JSON.stringify(result, null, 2)
            : result || "Client information submitted successfully.";

        showStatus(
          `Success! The client information was submitted.\n\n${successMessage}`,
          "success"
        );

        // Clear the client fields after a successful submission.
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("company").value = "";
      } catch (error) {
        let message = error.message || "Unable to submit the form.";

        if (
          message.toLowerCase().includes("failed to fetch") ||
          message.toLowerCase().includes("networkerror")
        ) {
          message +=
            "\n\nCheck that:\n" +
            "1. The n8n webhook is listening or the workflow is active.\n" +
            "2. The webhook URL is correct.\n" +
            "3. Your n8n server allows browser requests (CORS).\n" +
            "4. The page and webhook are both using HTTPS when hosted online.";
        }

        showStatus(`Submission failed.\n\n${message}`, "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit Client Information";
      }
    });

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status ${type}`;
    }
  </script>
</body>
</html>
